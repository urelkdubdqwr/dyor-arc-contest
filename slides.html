<!doctype html><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700;9..40,800&display=swap');
  * { margin:0; box-sizing:border-box; }
  body { background:#000; font-family:'DM Sans',sans-serif; }
  .slide { width:1080px; height:1920px; position:relative; overflow:hidden; display:none;
    background:radial-gradient(1200px 800px at 50% 18%, #16181d 0%, #0b0c0e 55%, #060607 100%); color:#fff; }
  .slide.on { display:flex; }
  .col { flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:80px; }
  .kicker { font-size:34px; letter-spacing:.35em; text-transform:uppercase; color:#9aa0a6; margin-bottom:44px; }
  .h1 { font-size:150px; font-weight:800; line-height:1.02; letter-spacing:-.02em;
        background:linear-gradient(180deg,#fff 60%,rgba(255,255,255,.35)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .sub { font-size:64px; font-weight:500; color:#c9cdd2; margin-top:40px; }
  .rule { width:220px; height:4px; background:linear-gradient(90deg,transparent,#fff,transparent); margin:64px 0; }
  .brands { display:flex; align-items:center; gap:80px; margin-top:24px; }
  .brands img.rnd { width:300px; height:300px; border-radius:64px; object-fit:cover; filter:brightness(1.25) saturate(1.3);
    box-shadow:0 0 120px rgba(120,140,255,.25); }
  .brands img.arc { width:420px; }
  .x { font-size:80px; font-weight:800; color:#5f666e; }
  .tag { position:absolute; bottom:120px; left:0; right:0; text-align:center; font-size:44px; color:#9aa0a6; }
  .pool { display:inline-block; margin-top:56px; padding:22px 46px; border:2px solid #fff; border-radius:999px;
    font-size:46px; font-weight:700; letter-spacing:.06em; }
  .poster { position:absolute; inset:0; }
  .poster > .bgimg { width:1080px; filter:blur(14px) brightness(.16); transform:scale(1.06); }
  .scrim { position:absolute; inset:0; background:rgba(6,6,7,.8); }
  .mid { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:80px; }
</style>

<!-- S1: hook -->
<div class="slide col on" id="s1">
  <div class="kicker">Silent clip · 10s</div>
  <div class="h1">DYOR<br>IN ARC</div>
  <div class="sub">Do Your Own Research.</div>
  <div class="rule"></div>
  <div class="sub" style="font-size:52px;">Every ape buys a top.<br>The research buys the floor.</div>
</div>

<!-- S2: brands over contest poster -->
<div class="slide" id="s2">
  <div class="poster"><img class="bgimg" src="dyor_poster.jpg"><div class="scrim"></div>
    <div class="mid">
      <div class="kicker">DYOR&nbsp;×</div>
      <div class="brands">
        <img class="rnd" src="dyor_logo.jpg">
        <div class="x">×</div>
        <img class="arc" src="arc_logo_white.svg">
      </div>
      <div class="sub" style="margin-top:72px;">The Economic OS<br>for the internet.</div>
      <div class="pool">MULTI-CHAIN DEX → LIVE ON ARC</div>
    </div>
  </div>
</div>

<!-- S3: CTA -->
<div class="slide col" id="s3">
  <div class="h1" style="font-size:110px;">CHECK.<br>THEN CHAD.</div>
  <div class="rule"></div>
  <div class="sub" style="font-size:56px;">Research, swap, and LP on<br><b style="color:#fff">@DYORSWAPDEX</b><br>on <b style="color:#fff">Arc</b>.</div>
  <div class="tag">DYOR in ARC · Video Contest</div>
</div>
